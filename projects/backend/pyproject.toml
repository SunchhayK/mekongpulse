[project]
name = "mekong-backend"
version = "0.4.0"
description = "MekongPulse FastAPI gateway: telemetry API, risk map, webhook, sentinel scheduler endpoints."
requires-python = ">=3.12"
dependencies = [
    "mekong-shared",
    "mekong-bot",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
mekong-shared = { workspace = true }
mekong-bot = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mekong_backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
