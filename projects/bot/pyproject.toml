[project]
name = "mekong-bot"
version = "0.6.1"
description = "MekongPulse Telegram bot: location queries, subscriptions, advisor chat, alert dispatch."
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.12.0",
    "mekong-shared",
    "python-telegram-bot>=21.6",
]

[tool.uv.sources]
mekong-shared = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mekong_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
