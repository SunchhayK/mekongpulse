[project]
name = "mekong-shared"
version = "0.13.1"
description = "MekongPulse shared domain engine: telemetry, weather, spatial reasoner, agronomy, Khmer synthesis, persistence."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "shapely>=2.0",
    "asyncpg>=0.29",
    "lameenc>=1.7",
    "google-genai>=1.0",
    "google-cloud-firestore>=2.19",
    "google-cloud-storage>=2.18",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
cloud = [
    "google-cloud-tasks>=2.16",
    "google-cloud-bigquery>=3.25",
    "google-auth>=2.35",
]
otel = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mekong_shared"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
