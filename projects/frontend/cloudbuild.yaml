# Cloud Build config for the web dashboard: passes the public API base URL as a
# build arg (NEXT_PUBLIC_* values are baked at build time).
# Usage:
#   gcloud builds submit --config frontend/cloudbuild.yaml \
#     --substitutions=_IMAGE=<image>,_API_BASE=<backend-url> .
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=frontend/Dockerfile
      - --build-arg=NEXT_PUBLIC_API_BASE_URL=${_API_BASE}
      - --tag=${_IMAGE}
      - .
images:
  - ${_IMAGE}
