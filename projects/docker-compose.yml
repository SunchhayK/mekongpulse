# Local staging stack: backend + web dashboard (+ optional bot poller), shared
# Postgres via the pg_db container on the host.
#
#   ./scripts/switch_env.sh staging
#   ./scripts/init_db.sh
#   docker compose up --build            # backend + frontend
#   docker compose --profile bot up      # also run the Telegram poller
name: mekongpulse

x-host-postgres: &host-postgres
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:5432/mekongpulse_staging
      PUBLIC_BASE_URL: http://localhost:8080
      CORS_ORIGINS: http://localhost:3000
    <<: *host-postgres
    ports:
      - "8080:8080"
    volumes:
      - ./data/audio:/app/data/audio
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  bot:
    profiles: ["bot"]
    build:
      context: .
      dockerfile: bot/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:5432/mekongpulse_staging
    <<: *host-postgres
    volumes:
      - ./data/audio:/app/data/audio
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
